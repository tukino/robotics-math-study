<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2リンクアーム演習 — Robotics Math Study</title>
    <meta
      name="description"
      content="肩・肘の角度と手先位置、5 mm 一次補正をブラウザで試す日本語教材。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css?v=6" />
  </head>
  <body>
    <header class="site-header">
      <p class="brand">Robotics Math Study</p>
      <h1>2リンクアームを、予想してから動かす</h1>
      <ol class="progress-steps" id="progress-bar" aria-label="学習の進み具合">
        <li data-step="look" class="is-current"><span>1</span>見る</li>
        <li data-step="predict"><span>2</span>予想</li>
        <li data-step="check"><span>3</span>確認</li>
        <li data-step="correct"><span>4</span>5 mm補正</li>
        <li data-step="compare"><span>5</span>比較</li>
      </ol>
    </header>

    <div class="now-doing-bar" role="status">
      <p class="now-doing" id="now-doing" aria-live="polite">
        いまやること：実験台の図で肩・肘・手先を確認する
      </p>
    </div>

    <main class="layout">
      <section class="stage" aria-label="アーム図と操作">
        <div class="stage-header">
          <p class="panel-label">実験台</p>
          <p class="stage-hint" id="stage-hint">
            青＝上腕、オレンジ＝前腕、赤＝手先
          </p>
        </div>
        <div class="canvas-wrap">
          <canvas id="arm-canvas" width="640" height="520" aria-label="2リンクアームの図"></canvas>
        </div>
        <div id="angle-controls">
          <p class="controls-caption" data-role="controls-caption">
            手順で「操作してよい」と出るまで、スライダーはロックされています。
          </p>
          <div class="control-row">
            <label for="theta1-slider">θ₁ 肩</label>
            <input
              id="theta1-slider"
              data-role="theta1-slider"
              type="range"
              min="-180"
              max="180"
              step="1"
              value="30"
            />
            <input
              data-role="theta1-input"
              type="number"
              min="-180"
              max="180"
              step="1"
              value="30"
              aria-label="肩角度（度）"
            />
          </div>
          <div class="control-row">
            <label for="theta2-slider">θ₂ 肘</label>
            <input
              id="theta2-slider"
              data-role="theta2-slider"
              type="range"
              min="-150"
              max="150"
              step="1"
              value="45"
            />
            <input
              data-role="theta2-input"
              type="number"
              min="-150"
              max="150"
              step="1"
              value="45"
              aria-label="肘角度（度）"
            />
          </div>
          <div class="pose-readout" data-role="pose-readout" aria-live="polite"></div>
        </div>
      </section>

      <aside class="side" aria-label="手順パネル">
        <p class="panel-label">手順</p>
        <div id="exercise-panel"></div>
      </aside>
    </main>

    <details class="verify" id="verify-box">
      <summary>参考：Python 版との数値照合（学習後で十分）</summary>
      <div data-role="verify-body"></div>
    </details>

    <footer class="site-footer">
      <p>図・スライダー・計算は <code>docs/js/</code> の共通モジュールです。</p>
    </footer>

    <script src="./js/kinematics.js?v=4"></script>
    <script src="./js/arm-view.js?v=4"></script>
    <script src="./js/controls.js?v=4"></script>
    <script src="./js/exercises.js?v=4"></script>
    <script src="./js/app.js?v=4"></script>
  </body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-math-study"
version = "0.1.0"
description = "Reproducible experiments for learning robotics mathematics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
notebook = [
    "ipympl>=0.9",
    "jupyterlab>=4.0",
]
